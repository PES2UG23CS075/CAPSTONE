<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PEDA: inside the chip</title>
<style>
:root{--bg:#070b16;--tx:#d7e0f0;--mu:#8a97b3;--ac:#3fd0c9;--vi:#8b7cff;--pn:rgba(9,14,28,.86);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#cap{position:fixed;left:0;right:0;bottom:0;padding:14px 22px calc(12px + env(safe-area-inset-bottom,0px));background:var(--pn)}
#cap h1{margin:0 0 2px;font-size:18px;font-weight:650}
#cap p{margin:0;max-width:880px;color:var(--tx);font-size:14.5px}
#bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
#dots{display:flex;gap:5px;flex:1;min-width:120px}
#dots i{flex:1;height:4px;border-radius:2px;background:#26304a;cursor:pointer}
#dots i.on{background:var(--ac)}#dots i.done{background:#2b6f74}
button{font:inherit;font-size:13px;color:var(--tx);background:#18213a;border:1px solid #2a3556;border-radius:7px;padding:5px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hide #bar{display:none}
</style></head><body>
<canvas id="c" aria-label="Animated walkthrough of the PEDA congestion prediction project"></canvas>
<div id="cap"><h1 id="ct"></h1><p id="cd"></p>
<div id="bar"><button id="pv">Prev</button><button id="pl">Pause</button><button id="nx">Next</button><div id="dots"></div><button id="fs">Fullscreen</button><span style="color:var(--mu);font-size:12px">H hides controls</span></div></div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');let W,H;
function rs(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let sd=7;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
const N=240,P=[];for(let i=0;i<N;i++)P.push([R()*1.8-.9,R()*1.8-.9]);
const E=[];for(let i=0;i<N;i++){const d=P.map((p,j)=>[j,(p[0]-P[i][0])**2+(p[1]-P[i][1])**2]).sort((a,b)=>a[1]-b[1]);for(let k=1;k<=2;k++)if(d[k][0]>i)E.push([i,d[k][0]])}
const HS=[[-.4,.3,1],[.35,-.35,.9],[.1,.55,.7],[-.5,-.5,.6]];
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x),cl=x=>Math.max(0,Math.min(1,x));
let ang=.5,tilt=.95,V={ox:0,s:1},HM=1;
function pr(u,v,z){z=z||0;const c=Math.cos(ang),s=Math.sin(ang),x=u*c-v*s,y=u*s+v*c,Y=y*Math.sin(tilt)+z*Math.cos(tilt),D=y*Math.cos(tilt)-z*Math.sin(tilt),f=1/(1+D*.25),k=Math.min(W,H*1.5)*.3*V.s*f;return[W/2+V.ox+x*k,H*.4-Y*k]}
function heat(u,v,k){let h=0;HS.forEach((q,i)=>{const a=q[2]*(.75+.35*Math.sin(k*6.28+i*1.7)),d=(u-q[0]-.08*Math.sin(k*4+i))**2+(v-q[1])**2;h+=a*Math.exp(-d*9)});return Math.min(h,1)}
const HS2=[[.45,.35,1.1],[-.35,-.4,1],[-.1,.1,.9],[.5,-.5,.7]];
function heat2(u,v,k){let h=0;HS2.forEach((q,i)=>{const a=q[2]*(.75+.35*Math.sin(k*6.28+i*1.3)),d=(u-q[0]-.06*Math.sin(k*4+i))**2+(v-q[1])**2;h+=a*Math.exp(-d*8)});return Math.min(h,1)}
function rg(A,t){A.forEach((q,i)=>{const c=pr(q[0],q[1],.05),r=(12+7*Math.sin(t*3+i))*V.s;cx.strokeStyle='rgba(255,190,90,.9)';cx.lineWidth=2;cx.beginPath();cx.arc(c[0],c[1],r,0,6.3);cx.stroke()})}
function col(h,a){const r=Math.min(255,h*2.3*255|0),g=Math.max(0,(h-.45)*2*255|0),b=Math.max(0,(1-h*1.6)*190+45|0);return`rgba(${r},${g},${b},${a})`}
function quad(a,b,c,d){cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.lineTo(c[0],c[1]);cx.lineTo(d[0],d[1]);cx.closePath()}
function die(){quad(pr(-1,-1),pr(1,-1),pr(1,1),pr(-1,1));cx.fillStyle='#0d1428';cx.fill();cx.strokeStyle='#3a4a78';cx.lineWidth=2;cx.stroke();cx.lineWidth=1;cx.strokeStyle='rgba(90,110,170,.18)';cx.beginPath();for(let i=-3;i<=3;i++){const a=pr(i/4,-1),b=pr(i/4,1),c=pr(-1,i/4),d=pr(1,i/4);cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.moveTo(c[0],c[1]);cx.lineTo(d[0],d[1])}cx.stroke()}
function hm(fn,al){const G=20;for(let i=0;i<G;i++)for(let j=0;j<G;j++){const u0=-1+2*i/G,u1=-1+2*(i+1)/G,v0=-1+2*j/G,v1=-1+2*(j+1)/G,c=col(fn((u0+u1)/2,(v0+v1)/2)*HM,al);quad(pr(u0,v0),pr(u1,v0),pr(u1,v1),pr(u0,v1));cx.fillStyle=c;cx.strokeStyle=c;cx.fill();cx.stroke()}}
function nxy(i,dp){let u=P[i][0],v=P[i][1];if(dp){const d=dp(u,v);u+=d[0];v+=d[1]}return pr(u,v,.03)}
function nodes(nf,ef,mode,dp,al){al=al==null?1:al;const n=Math.floor(nf*N),m=Math.floor(ef*E.length);cx.globalAlpha=al;cx.lineWidth=1;cx.strokeStyle='rgba(63,208,201,.32)';cx.beginPath();for(let i=0;i<m;i++){const a=E[i][0],b=E[i][1];if(a>=n||b>=n)continue;const p1=nxy(a,dp),p2=nxy(b,dp);cx.moveTo(p1[0],p1[1]);cx.lineTo(p2[0],p2[1])}cx.stroke();for(let i=0;i<n;i++){const q=nxy(i,dp);cx.fillStyle=mode==='heat'?col(heat(P[i][0],P[i][1],.2)*HM,1):'#3fd0c9';cx.beginPath();cx.arc(q[0],q[1],2.2*V.s+.5,0,6.3);cx.fill()}cx.globalAlpha=1}
function tx(s,x,y,sz,c,al,w){cx.font=`${w||400} ${sz}px "Avenir Next","Segoe UI",system-ui,sans-serif`;cx.fillStyle=c||'#d7e0f0';cx.textAlign=al||'left';cx.fillText(s,x,y)}
function box(x,y,w,h){cx.fillStyle='rgba(12,18,36,.88)';cx.strokeStyle='#2a3556';cx.beginPath();cx.roundRect(x,y,w,h,10);cx.fill();cx.stroke()}
function rings(t){HS.forEach((q,i)=>{const c=pr(q[0],q[1],.05),r=(14+8*Math.sin(t*3+i))*V.s;cx.strokeStyle='rgba(255,190,90,.9)';cx.lineWidth=2;cx.beginPath();cx.arc(c[0],c[1],r,0,6.3);cx.stroke()})}
function bars(items,x,y,w,p,unit){items.forEach((it,i)=>{const yy=y+i*44;tx(it[0],x,yy,13,'#d7e0f0');const mid=x+w/2,L=it[1]*w/2*ease(p);cx.fillStyle=it[1]>=0?'#ffb85c':'#8b7cff';cx.fillRect(it[1]>=0?mid:mid+L,yy+8,Math.abs(L),12);tx((it[1]>0?'+':'')+it[1].toFixed(2),mid+(it[1]>=0?L+6:L-6),yy+19,12,'#d7e0f0',it[1]>=0?'left':'right')});cx.strokeStyle='#4a5a88';cx.beginPath();cx.moveTo(x+w/2,y-4);cx.lineTo(x+w/2,y+items.length*44-14);cx.stroke()}
const S=[
{t:'A chip is a tiny city',d:'This is a processor design (zero-riscy) on a silicon die. Millions of parts must be placed and wired without traffic jams. Our project predicts where those jams (congestion) will happen.',u:9,f:(p,t)=>{V.s=.7+.3*ease(p);die();tx('one design: zero-riscy',W/2,H*.14,14,'#8a97b3','center')}},
{t:'Nodes are cells, edges are wires',d:'Every logic cell becomes a node and every net that connects cells becomes edges. Real N14 graph: 34,983 nodes. This picture is a small sample.',u:11,f:(p,t)=>{die();nodes(cl(p*1.6),cl((p-.35)/.55));tx(`nodes ${Math.floor(cl(p*1.6)*N)} (sample)`,24,H*.14,14,'#3fd0c9')}},
{t:'Congestion: where wires pile up',d:'The RUDY map estimates routing demand. Bright spots are hotspots: too many wires wanting the same space. The model must predict this before the chip is built.',u:10,f:(p,t)=>{die();hm((u,v)=>heat(u,v,.2),ease(p)*.85);nodes(1,1,0,null,.45);if(p>.5)rings(t);tx('bright = congested',24,H*.14,14,'#ffb85c')}},
{t:'Every configuration changes the map',d:'Same chip, different settings: frequency, macro placement, utilization, placement seed. 3,441 configurations on N14 means 3,441 different heat maps. Our model takes the config as input.',u:11,f:(p,t)=>{die();hm((u,v)=>heat(u,v,p),.85);const nm=['freq','mp','fpu','fpa','p'];box(18,H*.12,190,170);nm.forEach((n,i)=>{const y=H*.12+30+i*28;tx(n,30,y,13);cx.fillStyle='#26304a';cx.fillRect(70,y-10,110,6);cx.fillStyle='#3fd0c9';cx.beginPath();cx.arc(70+110*(.5+.45*Math.sin(p*6+i*1.3)),y-7,6,0,6.3);cx.fill()})}},
{t:'Stage A: the graph neural network',d:'Messages pass along edges so each node learns from its neighbours (GCN). The graph is pooled into one embedding, joined with the config, and an MLP outputs one number: predicted congestion for that config.',u:12,f:(p,t)=>{die();nodes(1,1);cx.fillStyle='#8b7cff';for(let k=0;k<E.length;k+=9){const a=nxy(E[k][0]),b=nxy(E[k][1]),f=(t*.5+k*.13)%1;cx.beginPath();cx.arc(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,2.6,0,6.3);cx.fill()}const x=W*.68,y=H*.14;box(x,y,W*.28,120);tx('GCN, pool, config, MLP',x+14,y+26,13,'#8a97b3');cx.globalAlpha=ease((p-.5)*3);tx('0.0052',x+14,y+74,34,'#ffb85c',0,650);tx('one number per config',x+14,y+100,13);cx.globalAlpha=1}},
{t:'Two technologies, two congestion patterns',d:'The model learned on 28 nm (C2). A 14 nm chip looks different: hotspots land in other places and the overall level is higher (average RUDY 0.0018 vs 0.0049). Its configs also have 5 knobs instead of 4.',u:13,f:(p,t)=>{const a=ease(p*1.6);V.s=.6;V.ox=-W*.23;die();hm((u,v)=>heat(u,v,.2),.9*a);if(p>.55)rg(HS,t);V.ox=W*.23;die();hm((u,v)=>heat2(u,v,.2),.9*a);if(p>.55)rg(HS2,t);V.ox=0;V.s=1;tx('28 nm (C2)',W*.27,H*.15,15,'#d7e0f0','center',650);tx('14 nm (N14)',W*.73,H*.15,15,'#d7e0f0','center',650);cx.globalAlpha=ease((p-.5)*3);tx('42,102 nodes, average congestion 0.0018',W*.27,H*.64,13,'#8a97b3','center');tx('34,983 nodes, average congestion 0.0049',W*.73,H*.64,13,'#8a97b3','center');cx.globalAlpha=1}},
{t:'What carries over, what must be learned',d:'The idea behind transfer: the basic rules still hold (dense regions and high-fanout nets attract wires, and configs shift hotspots), so the 28 nm knowledge is reused. What differs is the level and where hotspots land. That gap is what LoRA learns. This is the assumption we test, not something proven.',u:15,f:(p,t)=>{V.s=.5;V.ox=-W*.25;die();hm((u,v)=>heat(u,v,.2),.6);const A=HS.map(q=>pr(q[0],q[1],.05));V.ox=W*.25;die();hm((u,v)=>heat2(u,v,.2),.6);const B=HS2.map(q=>pr(q[0],q[1],.05));V.ox=0;V.s=1;cx.globalAlpha=ease(p*2);cx.strokeStyle='#8b7cff';cx.lineWidth=1.5;cx.setLineDash([5,5]);A.forEach((a,i)=>{const b=B[i];cx.beginPath();cx.moveTo(a[0],a[1]);cx.quadraticCurveTo((a[0]+b[0])/2,Math.min(a[1],b[1])-70,b[0],b[1]);cx.stroke()});cx.setLineDash([]);cx.globalAlpha=1;tx('28 nm',W*.25,H*.13,14,'#d7e0f0','center',650);tx('14 nm',W*.75,H*.13,14,'#d7e0f0','center',650);const x=W*.1,y=H*.55,w=W*.8;box(x,y,w,118);tx('Shared, reused (frozen model)',x+18,y+26,14,'#3fd0c9',0,650);tx('Different, learned by LoRA',x+w/2+10,y+26,14,'#8b7cff',0,650);['dense regions attract wires','high-fanout nets add pressure','config knobs shift the hotspots'].forEach((s,i)=>{cx.globalAlpha=ease(p*4-i*.5);tx(s,x+18,y+54+i*22,13);cx.globalAlpha=1});['overall congestion level','where the hotspots land','the extra 14 nm config knob'].forEach((s,i)=>{cx.globalAlpha=ease(p*4-1.5-i*.5);tx(s,x+w/2+10,y+54+i*22,13);cx.globalAlpha=1})}},
{t:'How LoRA learns the gap',d:'The 28 nm model stays frozen and small adapters sit at three points. A 14 nm sample runs through it, the prediction is compared with the real map, and the error updates only the adapters (1,616 of 13,985 parameters, 11.56%). Each adapter squeezes through a rank-4 bottleneck and starts at zero, so training begins exactly at the 28 nm model and learns a small correction.',u:15,f:(p,t)=>{const x0=W*.05,st=W*.18,bw=W*.14,y=H*.22,L=['14 nm sample','GCN','Config encoder','MLP head','prediction'],ad=[];L.forEach((n,i)=>{const x=x0+i*st,fr=i>0&&i<4;cx.fillStyle=fr?'#1a2442':'#123b3f';cx.strokeStyle=fr?'#3a4a78':'#3fd0c9';cx.beginPath();cx.roundRect(x,y,bw,50,8);cx.fill();cx.stroke();tx(n,x+bw/2,y+25,12.5,'#d7e0f0','center');if(fr){tx('frozen',x+bw/2,y+43,10.5,'#8a97b3','center');const g=ease(p*2-i*.3);cx.fillStyle=`rgba(139,124,255,${.25+.7*g})`;cx.beginPath();cx.roundRect(x+bw*.2,y-34,bw*.6,24,6);cx.fill();tx('adapter',x+bw/2,y-17,11,'#fff','center');ad.push([x+bw/2,y-10])}if(i<4){cx.strokeStyle='#4a5a88';cx.beginPath();cx.moveTo(x+bw,y+25);cx.lineTo(x+st,y+25);cx.stroke()}});const lx=x0+4*st,ly=H*.42,lw=bw*1.3;box(lx-bw*.15,ly,lw,54);tx('error vs real map',lx+bw/2,ly+22,12,'#d7e0f0','center');tx(`loss ${(1-.9*ease(p)).toFixed(2)} (schematic)`,lx+bw/2,ly+42,11.5,'#ffb85c','center');cx.strokeStyle='rgba(139,124,255,.5)';cx.lineWidth=1.2;ad.forEach((a,i)=>{cx.beginPath();cx.moveTo(lx+bw/2,ly);cx.lineTo(a[0],a[1]);cx.stroke();const f=(t*.5+i*.3)%1;cx.fillStyle='#8b7cff';cx.beginPath();cx.arc(lx+bw/2+(a[0]-lx-bw/2)*f,ly+(a[1]-ly)*f,3.4,0,6.3);cx.fill()});tx('only adapters receive the update',W*.05,H*.46,13,'#8b7cff');const bx=W*.07,by=H*.6;cx.fillStyle='#1a2442';cx.fillRect(bx,by,60,44);cx.fillStyle='#8b7cff';cx.fillRect(bx+110,by+16,60,12);cx.fillStyle='#1a2442';cx.fillRect(bx+220,by,60,44);cx.strokeStyle='#4a5a88';cx.beginPath();cx.moveTo(bx+62,by+22);cx.lineTo(bx+108,by+22);cx.moveTo(bx+172,by+22);cx.lineTo(bx+218,by+22);cx.stroke();tx('down',bx+85,by-6,11,'#8a97b3','center');tx('rank 4',bx+140,by+46,11,'#8b7cff','center');tx('up (starts at 0)',bx+250,by+60,11,'#8a97b3','center');cx.globalAlpha=ease(p*3);tx('output = x + scale * up(relu(down(x)))',bx+310,by+20,14,'#d7e0f0');tx('1,616 of 13,985 parameters train (11.56%)',bx+310,by+44,13,'#ffb85c');cx.globalAlpha=1}},
{t:'Adapting to a new technology with PEDA',d:'A model trained on 28 nm (C2) fails on 14 nm: correlation about 0.04. We freeze the trained model and add tiny LoRA-style adapters. Training only 11.56% of the parameters lifts N14 correlation to 0.72.',u:13,f:(p,t)=>{V.ox=-W*.2;V.s=.72;die();hm((u,v)=>heat(u,v,.35),.8);V.ox=0;V.s=1;const x=W*.5,y=H*.1;box(x,y,W*.46,H*.5);['GCN encoder','Config encoder','MLP head'].forEach((n,i)=>{const yy=y+20+i*66;cx.fillStyle='#1a2442';cx.fillRect(x+16,yy,200,40);tx(n+' (frozen)',x+26,yy+25,13);const g=ease(p*2.2-i*.35);cx.fillStyle=`rgba(139,124,255,${.25+.7*g})`;cx.fillRect(x+230,yy+6,90,28);tx('adapter',x+240,yy+25,12,'#fff')});const pv=.04+.68*ease((p-.25)*1.4);tx('Pearson on N14',x+16,y+H*.5-56,13,'#8a97b3');cx.fillStyle='#26304a';cx.fillRect(x+16,y+H*.5-44,200,12);cx.fillStyle='#3fd0c9';cx.fillRect(x+16,y+H*.5-44,200*pv,12);tx(pv.toFixed(2),x+230,y+H*.5-34,18,'#ffb85c',0,650)}},
{t:'How does PEDA compare?',d:'On N14: no adaptation 0.04, PEDA 0.72, from scratch 0.81, full fine-tuning 0.85. PEDA trains far fewer parameters but is not the most accurate. Numbers are from a single run.',u:11,f:(p,t)=>{const it=[['No adaptation',.04,'0%'],['PEDA (adapters)',.72,'11.56%'],['From scratch',.81,'100%'],['Full fine-tune',.85,'100%']],bx=W*.12,bw=W*.5;it.forEach((q,i)=>{const y=H*.16+i*70;tx(q[0],bx,y,15);cx.fillStyle='#26304a';cx.fillRect(bx,y+10,bw,18);cx.fillStyle=i==1?'#8b7cff':'#3fd0c9';cx.fillRect(bx,y+10,bw*q[1]*ease(p*1.3-i*.12),18);tx(q[1].toFixed(2),bx+bw+14,y+26,16,'#ffb85c',0,650);tx('trainable '+q[2],bx+bw+70,y+26,13,'#8a97b3')})}},
{t:'One number is not enough',d:'A designer needs to know where the trouble is. So we move from one number per config to one number per node: every cell gets its own predicted congestion.',u:10,f:(p,t)=>{die();nodes(1,1,'heat',null,.4+.6*ease(p));nodes(cl(p*1.4),1,'heat')}},
{t:'Stage B: node-level prediction',d:'The node-level GNN predicts each cell, and we redraw the values on the chip grid. Preliminary similarity to the real RUDY map: SSIM about 0.54 on 3 validation configs.',u:12,f:(p,t)=>{V.s=.6;V.ox=-W*.23;die();hm((u,v)=>heat(u,v,.2),.9);V.ox=W*.23;die();hm((u,v)=>cl(.85*heat(u,v,.2)+.1*Math.sin(u*9)*Math.cos(v*7)+.05),.9*ease(p*1.5));V.ox=0;V.s=1;tx('real RUDY',W*.27,H*.15,14,'#d7e0f0','center');tx('model prediction (schematic)',W*.73,H*.15,14,'#d7e0f0','center');tx('SSIM about 0.54, preliminary',W/2,H*.62,17,'#ffb85c','center',650)}},
{t:'Explain: what drives the hotspots?',d:'We correlate predicted congestion with placement density, fanout and degree. Density pushes congestion up, high fanout correlates negatively, degree is weak. This is correlation from 3 configs, not proof of cause.',u:12,f:(p,t)=>{V.ox=-W*.2;V.s=.72;die();hm((u,v)=>heat(u,v,.2),.85);rings(t);V.ox=0;V.s=1;box(W*.5,H*.12,W*.46,180);tx('correlation with predicted congestion',W*.5+16,H*.12+26,13,'#8a97b3');bars([['local placement density',.49],['average fanout',-.36],['degree',.09]],W*.5+16,H*.12+58,W*.46-32,p)}},
{t:'Recommend: turn causes into actions',d:'Each hotspot gets its dominant cause and a known EDA fix: density suggests more whitespace or re-placement, high fanout suggests buffering or splitting nets. Below is an illustration of the suggested action, not a re-run result.',u:12,f:(p,t)=>{const e=ease(p);HM=1-.45*e;die();hm((u,v)=>heat(u,v,.2),.85);nodes(1,1,'heat',(u,v)=>{let dx=0,dy=0;HS.forEach(q=>{const a=u-q[0],b=v-q[1],d=Math.hypot(a,b);if(d<.35&&d>.001){const m=e*.12*(1-d/.35);dx+=a/d*m;dy+=b/d*m}});return[dx,dy]},1);HM=1;const a=pr(HS[0][0],HS[0][1],.3),b=pr(HS[1][0],HS[1][1],.3);cx.globalAlpha=ease(p*2);box(a[0]-150,a[1]-92,190,46);tx('Add whitespace / re-place',a[0]-140,a[1]-64,13,'#ffb85c');box(b[0]-30,b[1]-92,210,46);tx('Buffer / split high-fanout nets',b[0]-20,b[1]-64,13,'#8b7cff');cx.globalAlpha=1}},
{t:'The whole story',d:'Predict where congestion happens, adapt the model to new technologies with 11.56% of the parameters, explain the hotspots, recommend fixes. Still to do: placement coordinates as inputs, full node-level validation, multiple seeds.',u:12,f:(p,t)=>{V.ox=-W*.2;V.s=.75;die();hm((u,v)=>heat(u,v,.2),.7);nodes(1,1,0,null,.6);V.ox=0;V.s=1;const L=['Predict: graph-level, then node-level','Adapt: PEDA adapters, N28 to N14','Explain: density, fanout, degree','Recommend: whitespace, buffering'],x=W*.5;L.forEach((s,i)=>{cx.globalAlpha=ease(p*3-i*.5);tx(s,x,H*.22+i*44,17);cx.globalAlpha=1})}}
];
const ct=document.getElementById('ct'),cd=document.getElementById('cd'),dots=document.getElementById('dots'),pl=document.getElementById('pl');
S.forEach((s,i)=>{const d=document.createElement('i');d.onclick=()=>go(i);dots.appendChild(d)});
let idx=0,st=0,gt=0,play=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=performance.now();
